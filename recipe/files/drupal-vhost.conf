<VirtualHost *:8080>
    DocumentRoot /opt/drupal/web
    <Directory /opt/drupal/web>
        Options -Indexes +FollowSymLinks
        AllowOverride All
        Require all granted
    </Directory>
    # Drupal is installed by the container entrypoint before Apache starts: the web installer is never served, so
    # nobody who reaches this port can install or reinstall the site.
    <Location "/core/install.php">
        Require all denied
    </Location>
    # Uploaded files are data, never code: PHP is not executed under sites/default/files (Drupal's own .htaccess
    # there says the same; php_admin_flag cannot be changed by an .htaccess file).
    <Directory /opt/drupal/web/sites/default/files>
        php_admin_flag engine off
        <FilesMatch "\.(?i:php[0-9]?|phtml|phar)$">
            Require all denied
        </FilesMatch>
    </Directory>
    ErrorLog /proc/self/fd/2
    CustomLog /proc/self/fd/1 combined
</VirtualHost>
